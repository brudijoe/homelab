# Ansible Tasks Schema
- name: Install docker
  ansible.builtin.apt: # advanced package tool
    name: docker.io
    state: present # apt install
    update_cache: true # Run the equivalent of "apt-get update" before the operation to ensure that docker.io exists
    cache_valid_time: 3600 # Only update when older than 1 hour

- name: Add raspberry pi user to the docker group
  user:
    name: "{{ ansible_user_name }}"
    groups: docker
    append: true # add docker group without removing user from other groups like sudo

- name: Reset SSH connection to apply group changes
  meta: reset_connection

- name: Run Docker container
  community.docker.docker_container:
    name: "{{ container_name }}"
    image: "{{ image_name }}"
    state: started # Asserts that the container is first present, and then if the container is not running moves it to a running state
    restart_policy: always
    published_ports:
      - "{{ host_port }}:{{ container_port }}"
